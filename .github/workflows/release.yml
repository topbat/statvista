name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tests must pass before release
        run: |
          node mvp/server/tests.js
          node mvp/tools/test-demo-shim.node.js
          echo "✅ tests green — releasing $GITHUB_REF_NAME"

      - name: Package demo site (zip)
        run: |
          cd docs
          zip -r ../statvista-demo-static-${GITHUB_REF_NAME}.zip demo index.html
          ls -la ../statvista-demo-static-*.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "StatVista $GITHUB_REF_NAME" \
            --generate-notes \
            statvista-demo-static-*.zip
