<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="960" height="200" role="img" aria-label="StatVista — 指标先行的统计数据多维可视表平台">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D3A8A"/>
      <stop offset="1" stop-color="#0A1E3F"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2E7CD6"/>
      <stop offset="1" stop-color="#63B3F5"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(99,179,245,0)"/>
      <stop offset="1" stop-color="rgba(99,179,245,.14)"/>
    </linearGradient>
  </defs>

  <!-- 圆角卡片底 -->
  <rect x="2" y="2" width="956" height="196" rx="26" fill="url(#bg)"/>
  <rect x="2" y="2" width="956" height="196" rx="26" fill="url(#sheen)"/>
  <rect x="2" y="2" width="956" height="196" rx="26" fill="none" stroke="rgba(148,197,255,.30)" stroke-width="2"/>

  <!-- 点阵网格装饰 -->
  <g fill="rgba(148,197,255,.10)">
    <circle cx="706" cy="48" r="2.4"/><circle cx="738" cy="48" r="2.4"/><circle cx="770" cy="48" r="2.4"/><circle cx="802" cy="48" r="2.4"/><circle cx="834" cy="48" r="2.4"/><circle cx="866" cy="48" r="2.4"/><circle cx="898" cy="48" r="2.4"/><circle cx="930" cy="48" r="2.4"/>
    <circle cx="706" cy="80" r="2.4"/><circle cx="738" cy="80" r="2.4"/><circle cx="770" cy="80" r="2.4"/><circle cx="802" cy="80" r="2.1" fill="rgba(246,203,125,.5)"/><circle cx="834" cy="80" r="2.4"/><circle cx="866" cy="80" r="2.4"/><circle cx="898" cy="80" r="2.4"/><circle cx="930" cy="80" r="2.4"/>
    <circle cx="706" cy="112" r="2.4"/><circle cx="738" cy="112" r="2.4"/><circle cx="770" cy="112" r="2.4"/><circle cx="802" cy="112" r="2.4"/><circle cx="834" cy="112" r="2.4"/><circle cx="866" cy="112" r="2.4"/><circle cx="898" cy="112" r="2.4"/><circle cx="930" cy="112" r="2.4"/>
    <circle cx="706" cy="144" r="2.4"/><circle cx="738" cy="144" r="2.4"/><circle cx="745" cy="144" r="2.4" fill="rgba(59,224,245,.45)"/><circle cx="770" cy="144" r="2.4"/><circle cx="802" cy="144" r="2.4"/><circle cx="866" cy="144" r="2.4"/><circle cx="898" cy="144" r="2.4"/><circle cx="930" cy="144" r="2.4"/>
  </g>
  <!-- 右侧迷你柱环装饰 -->
  <g opacity=".85">
    <rect x="846" y="120" width="12" height="30" rx="3" fill="url(#bar)" opacity=".55"/>
    <rect x="864" y="106" width="12" height="44" rx="3" fill="url(#bar)" opacity=".7"/>
    <rect x="882" y="92" width="12" height="58" rx="3" fill="url(#bar)"/>
    <rect x="900" y="76" width="12" height="74" rx="3" fill="#F6CB7D"/>
  </g>

  <!-- 图标（logo.svg 等比缩小） -->
  <g transform="translate(30,26) scale(1.15)">
    <rect x="4" y="4" width="120" height="120" rx="28" fill="rgba(255,255,255,.06)" stroke="rgba(148,197,255,.45)" stroke-width="2"/>
    <rect x="28" y="74" width="15" height="26" rx="4" fill="url(#bar)" opacity=".62"/>
    <rect x="49" y="62" width="15" height="38" rx="4" fill="url(#bar)" opacity=".78"/>
    <rect x="70" y="48" width="15" height="52" rx="4" fill="url(#bar)"/>
    <rect x="91" y="32" width="15" height="68" rx="4" fill="#F6CB7D"/>
    <path d="M 26 68 C 46 58, 66 42, 90 26" fill="none" stroke="#FFD98A" stroke-width="4.5" stroke-linecap="round" opacity=".95"/>
    <circle cx="90" cy="26" r="5.5" fill="#FFD98A"/>
    <line x1="24" y1="102" x2="106" y2="102" stroke="rgba(233,242,252,.55)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 字标与标语 -->
  <text x="196" y="96" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="58" font-weight="700" fill="#E9F2FC" letter-spacing="1">StatVista</text>
  <text x="199" y="136" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" fill="#9DB4D0" letter-spacing="3">指标先行的统计数据多维可视表平台</text>
  <text x="200" y="166" font-family="Consolas, monospace" font-size="15" fill="rgba(246,203,125,.85)" letter-spacing="2">METRIC-FIRST · DRILL-DOWN · CROSS-FILTER · COCKPIT</text>
</svg>
